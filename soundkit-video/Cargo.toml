[package]
name = "soundkit-video"
version = "0.13.1"
edition = "2021"
license = "MIT"
description = "Pure-Rust video decoders and canonical frame surfaces for SoundKit."
repository = "https://github.com/wavey-ai/soundkit"

[features]
# AV1 is the one native decoder (rusty_av1d, C asm), so it is off by default:
# the crate and its crates.io release are pure Rust. Enable `av1` to opt in.
default = ["h264", "hevc", "vp9", "prores", "dnx"]
h264 = ["dep:rusty_h264-common", "dep:rusty_h264-decoder"]
hevc = ["dep:rust_h265"]
vp9 = ["dep:vp9dec"]
av1 = ["dep:rusty_av1d"]
prores = ["dep:oxideav-core", "dep:oxideav-prores"]
dnx = ["dep:soundkit-dnx"]

[dependencies]
rusty_h264-decoder = { path = "../vendor/rusty_h264-decoder", version = "0.10.0", default-features = false, optional = true }
rusty_h264-common = { version = "0.10.0", default-features = false, optional = true }
rust_h265 = { git = "https://github.com/wavey-ai/rust_h265.git", version = "0.1.0", branch = "main", optional = true }
vp9dec = { git = "https://github.com/wavey-ai/vp9dec.git", version = "0.1.1", branch = "main", optional = true }
oxideav-core = { version = "0.1.31", optional = true }
oxideav-prores = { version = "0.1.1", optional = true }
soundkit-dnx = { path = "../soundkit-dnx", version = "0.13.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusty_av1d = { version = "1.2.0", default-features = false, features = ["asm", "asm_arm64_dotprod", "bitdepth_8", "bitdepth_16"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rusty_av1d = { version = "1.2.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"], optional = true }
