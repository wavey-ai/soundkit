[package]
name = "soundkit-alac"
version = "0.12.3"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "In-tree pure Rust ALAC decoder for SoundKit."
repository = "https://github.com/wavey-ai/soundkit"
readme = "README.md"

[dependencies]
frame-header = "0.2.1"
soundkit = { path = "../soundkit" }
soundkit-audio-demux = { path = "../soundkit-audio-demux", default-features = false }

[dev-dependencies]
soundkit-audio-demux = { path = "../soundkit-audio-demux", default-features = false, features = ["mp4"] }
