[package]
name = "soundkit-stream"
version = "0.13.3"
edition = "2021"
license = "MIT"
description = "SoundKit v2 frame-stream encoding (Opus and FLAC) and sidecar index utilities."
repository = "https://github.com/wavey-ai/soundkit"
readme = "README.md"

[dependencies]
frame-header = "0.2.2"
soundkit-flac = { path = "../soundkit-flac", version = "0.13.3", default-features = false }
soundkit-opus = { path = "../soundkit-opus", version = "0.13.3" }
soundkit-visuals = { path = "../soundkit-visuals", version = "0.1.0" }
