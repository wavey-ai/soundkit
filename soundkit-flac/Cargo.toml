[package]
name = "soundkit-flac"
version = "0.13.0"

edition = "2021"
license = "Apache-2.0"
description = "Pure-Rust FLAC encoding and decoding for SoundKit"
repository = "https://github.com/wavey-ai/soundkit"

[dependencies]
soundkit = { path = "../soundkit" }
heapless = "0.8.0"
md-5 = "0.10.6"
num-traits = "0.2"
rustversion = "1.0"
seq-macro = "0.3"

[features]
default = []
simd-nightly = []
decode-trace = []

[[example]]
name = "flac_frame_cost"

[[example]]
name = "flac_frame_file"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(fuzzing)',
  'cfg(feature, values("serde", "experimental", "par", "decode"))',
] }

[dev-dependencies]
rand = "0.8.5"
hound = "3.5"
