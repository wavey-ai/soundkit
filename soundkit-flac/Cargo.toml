[package]
name = "soundkit-flac"
version = "0.12.3"
edition = "2021"
license = "MIT"
description = "FLAC packet codec support for Soundkit"
repository = "https://github.com/wavey-ai/soundkit"

[dependencies]
soundkit = { path = "../soundkit" }
wavey-flac = { git = "https://github.com/wavey-ai/flac.git", branch = "main", default-features = false, optional = true }

[features]
default = ["wavey-codec"]
wavey-codec = ["dep:wavey-flac"]
packet-codec = ["wavey-codec"]

[[example]]
name = "flac_frame_cost"
required-features = ["packet-codec"]

[[example]]
name = "flac_frame_file"
required-features = ["packet-codec"]
