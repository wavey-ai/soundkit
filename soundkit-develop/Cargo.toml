[package]
name = "soundkit-develop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Photographic development for SoundKit: white balance, tone, colour in OKLab, detail and effects, for WebAssembly and native."
repository = "https://github.com/wavey-ai/soundkit"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["tiff"]
tiff = ["dep:tiff"]
wasm = ["dep:wasm-bindgen", "dep:js-sys", "tiff"]

[dependencies]
serde_json = "1"
tiff = { version = "0.11", optional = true, default-features = false, features = ["deflate", "jpeg", "lzw"] }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
