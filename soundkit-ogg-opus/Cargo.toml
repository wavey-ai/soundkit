[package]
name = "soundkit-ogg-opus"
version = "0.12.3"
edition = "2021"
license = "MIT"
description = "Streaming Ogg Opus decoder built on soundkit and ogg"
repository = "https://github.com/wavey-ai/soundkit"
readme = "README.md"

[dependencies]
frame-header = { version = "0.2.1", optional = true }
soundkit = { version = "0.12.3", path = "../soundkit" }
soundkit-opus = { version = "0.13.0", path = "../soundkit-opus", optional = true }
tracing = "0.1.40"

[features]
default = ["decode"]
decode = ["dep:frame-header", "dep:soundkit-opus", "soundkit-opus/full-opus"]

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lib]
crate-type = ["cdylib", "rlib"]
