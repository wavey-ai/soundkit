[package]
name = "soundkit-audio-demux"
version = "0.12.3"
edition = "2021"
license = "MIT"
description = "Streaming audio track demuxer for browser-safe SoundKit container extraction."
repository = "https://github.com/wavey-ai/soundkit"

[features]
default = ["mp4", "webm", "mpeg-ts", "mxf"]
mp4 = ["dep:soundkit-video"]
webm = ["dep:soundkit-webm"]
mpeg-ts = ["dep:access-unit"]
mxf = ["dep:soundkit-video"]

[dependencies]
access-unit = { path = "../access-unit", optional = true }
soundkit-video = { path = "../soundkit-video", default-features = false, optional = true }
soundkit-webm = { path = "../soundkit-webm", default-features = false, features = ["vorbis"], optional = true }

[dev-dependencies]
sha2 = "0.10"

[[example]]
name = "inspect-mp4-media"
required-features = ["mp4"]

[[example]]
name = "extract-mp4-track"
required-features = ["mp4"]

[[example]]
name = "inspect-mxf-media"
required-features = ["mxf"]
