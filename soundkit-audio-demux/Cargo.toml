[package]
name = "soundkit-audio-demux"
version = "0.13.3"
edition = "2021"
license = "MIT"
description = "Streaming audio track demuxer for browser-safe SoundKit container extraction."
repository = "https://github.com/wavey-ai/soundkit"

[features]
default = ["mp4", "webm", "mpeg-ts", "mxf"]
mp4 = ["dep:soundkit-video"]
webm = ["dep:soundkit-webm"]
mpeg-ts = ["dep:access-unit"]
mxf = ["dep:soundkit-video"]
decode-video = [
  "mp4",
  "soundkit-video/h264",
  "soundkit-video/hevc",
  "soundkit-video/vp9",
  "soundkit-video/av1",
  "soundkit-video/prores",
  "soundkit-video/dnx",
]

[dependencies]
access-unit = { version = "0.1.5", optional = true }
soundkit-video = { path = "../soundkit-video", version = "0.13.3", default-features = false, optional = true }
soundkit-webm = { path = "../soundkit-webm", version = "0.13.3", default-features = false, features = ["vorbis"], optional = true }

[dev-dependencies]
sha2 = "0.10"

[[example]]
name = "inspect-mp4-media"
required-features = ["mp4"]

[[example]]
name = "extract-mp4-track"
required-features = ["mp4"]

[[example]]
name = "decode-mp4-keyframes"
required-features = ["decode-video"]

[[example]]
name = "inspect-mxf-media"
required-features = ["mxf"]
