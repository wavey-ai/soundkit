[package]
name = "aac-wasm-bench"
version = "0.12.3"
edition = "2021"
publish = false
license = "MIT"
description = "WASM AAC decoder benchmark for SoundKit AAC-LC, FDK AAC, Symphonia, and OxideAV status."
readme = "README.md"
repository = "https://github.com/wavey-ai/soundkit"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["fdk", "symphonia", "soundkit-lc"]
fdk = ["dep:fdk-aac"]
symphonia = ["dep:symphonia-codec-aac", "dep:symphonia-core"]
oxideav = ["dep:oxideav-aac"]
soundkit-lc = ["dep:soundkit-aac-lc"]
soundkit-lc-ablate-spectrum = ["soundkit-lc", "soundkit-aac-lc/bench-ablate-spectrum"]
soundkit-lc-ablate-tools = ["soundkit-lc", "soundkit-aac-lc/bench-ablate-tools"]
soundkit-lc-ablate-synth = ["soundkit-lc", "soundkit-aac-lc/bench-ablate-synth"]
wasm-bindgen-api = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
fdk-aac = { git = "https://github.com/wavey-ai/fdk-aac-rs.git", branch = "main", optional = true }
oxideav-aac = { git = "https://github.com/OxideAV/oxideav-aac.git", optional = true }
soundkit = { path = "../soundkit" }
soundkit-aac-lc = { path = "../soundkit-aac-lc", optional = true }
symphonia-codec-aac = { version = "0.6.0", optional = true }
symphonia-core = { version = "0.6.0", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
