[package]
name = "soundkit-opus"
version = "0.12.3"
edition = "2021"
license = "MIT"
description = "Opus Encoder traits"
repository = "https://github.com/wavey-ai/soundkit"
readme = "README.md"

[dependencies]
# Full SILK, hybrid, and CELT coverage for general Opus containers.
ropus = "0.12.18"
soundkit = { path = "../soundkit" }
frame-header = "0.2.2"
tracing = "0.1.40"
libopus-rs = { path = "libopus-rs" }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
[lib]
crate-type = ["cdylib", "rlib"]
