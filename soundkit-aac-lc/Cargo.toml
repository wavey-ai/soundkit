[package]
name = "soundkit-aac-lc"
version = "0.12.3"
edition = "2021"
license = "MIT"
description = "SoundKit-owned pure Rust AAC-LC decoder core for wasm and worker targets."
readme = "README.md"
repository = "https://github.com/wavey-ai/soundkit"

[lib]
name = "soundkit_aac_lc"
path = "src/lib.rs"

[features]
bench-ablate-spectrum = []
bench-ablate-tools = []
bench-ablate-synth = []

[dependencies]

[dev-dependencies]
rusty_aac = { version = "0.5.0", default-features = false }
# Only to read a real container in the local-fixture test; the decoder
# itself does not demux.
soundkit-audio-demux = { path = "../soundkit-audio-demux", default-features = false, features = ["mp4"] }

[target.'cfg(not(any(target_arch = "wasm32", target_arch = "wasm64")))'.dependencies]
rustfft = "6.4.1"
