[workspace]
resolver = "2"
members = [
  "access-unit",
  "soundkit",
  "soundkit-aac",
  "soundkit-aac-lc",
  "soundkit-flac",
  "soundkit-g711",
  "soundkit-g722",
  "soundkit-g729",
  "soundkit-amr",
  "soundkit-g726",
  "soundkit-gsm",
  "soundkit-speex",
  "soundkit-vorbis",
  "soundkit-alac",
  "soundkit-aiff",
  "soundkit-ac3",
  "soundkit-opus",
  "soundkit-mp3",
  "soundkit-ogg-opus",
  "soundkit-webm",
  "soundkit-audio-demux",
  "soundkit-dnx",
  "soundkit-video",
  "soundkit-wasm",
  "soundkit-decoder",
  "soundkit-fmp4",
  "soundkit-container-bench",
  "soundkit-codec-fate",
  "lori-asha-premix-bench",
  "aac-wasm-bench",
]
exclude = ["vendor/rusty_av1d", "vendor/rusty_h264-decoder"]

[patch.crates-io]
rusty_av1d = { path = "vendor/rusty_av1d" }
soundkit-opus = { path = "soundkit-opus" }

[profile.release]
codegen-units = 1
lto = "thin"

# LLVM 21+ currently SIGBUSes while optimizing vp9dec's deeply nested scalar
# loops at level 3 on AArch64 and wasm32. Level 2 preserves optimization and
# produces stable native and browser builds until that compiler defect is fixed.
[profile.release.package.vp9dec]
opt-level = 2
