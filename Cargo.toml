[workspace]
resolver = "2"
members = [
  "soundkit",
  "soundkit-aac",
  "soundkit-aac-lc",
  "soundkit-flac",
  "soundkit-g711",
  "soundkit-g722",
  "soundkit-g729",
  "soundkit-amr",
  "soundkit-g726",
  "soundkit-gsm",
  "soundkit-speex",
  "soundkit-vorbis",
  "soundkit-alac",
  "soundkit-aiff",
  "soundkit-ac3",
  "soundkit-opus",
  "soundkit-mp3",
  "soundkit-ogg-opus",
  "soundkit-webm",
  "soundkit-audio-demux",
  "soundkit-dnx",
  "soundkit-video",
  "soundkit-wasm",
  "soundkit-decoder",
  "lori-asha-premix-bench",
  "aac-wasm-bench",
]
exclude = ["vendor/rusty_av1d"]

[patch.crates-io]
rusty_av1d = { path = "vendor/rusty_av1d" }

# LLVM 21 currently SIGBUSes while optimizing vp9dec's deeply nested scalar
# loops at level 3 for wasm32. Level 2 preserves optimization and produces a
# stable browser build until that upstream compiler defect is resolved.
[profile.release.package.vp9dec]
opt-level = 2
