[package]
name = "soundkit-wasm"
version = "0.13.3"
edition = "2021"
license = "MIT"
description = "Browser WASM streaming music decoder facade for SoundKit codecs."
repository = "https://github.com/wavey-ai/soundkit"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["browser-audio", "video"]
browser-audio = [
  "detect",
  "raw-pcm",
  "wav",
  "mp3",
  "vorbis",
  "aiff",
  "alac",
  "flac",
  "webm",
  "webm-opus",
  "opus",
  "ogg-opus",
  "opus-debox",
  "aac-debox",
  "m4a",
  "audio-demux",
  "ac3",
]
detect = ["dep:access-unit"]
audio-demux = ["dep:soundkit-audio-demux"]
video = ["dep:soundkit-video"]
# Decoded MOV/MP4 keyframe timelines: the sync-sample map plus per-keyframe
# pixel decode. Reached from a source reader (offset, length) so the browser
# can index a large movie without holding it in WASM memory.
video-keyframes = ["audio-demux", "video", "soundkit-audio-demux/decode-video"]
raw-pcm = []
wav = []
mp3 = ["dep:soundkit-mp3"]
vorbis = ["dep:soundkit-vorbis"]
flac = [
  "dep:soundkit-flac",
]
aac = ["dep:soundkit-aac", "soundkit-aac/owned-lc"]
m4a = ["aac", "soundkit-aac/mp4-decoder"]
aac-debox = ["dep:soundkit-aac", "soundkit-aac/mp4-demux"]
# Compatibility aliases. All production and packet-level AAC decoding now
# enters through `soundkit-aac`; `soundkit-aac-lc` is its internal engine.
aac-lc = ["aac"]
aac-lc-bench = ["aac"]
alac = ["dep:soundkit-alac"]
aiff = ["dep:soundkit-aiff"]
opus = ["dep:soundkit-opus", "dep:soundkit-stream"]
ogg-opus = ["opus", "dep:soundkit-ogg-opus", "soundkit-ogg-opus/decode"]
opus-debox = ["dep:soundkit-ogg-opus", "dep:soundkit-webm"]
webm = ["dep:soundkit-webm", "soundkit-webm/vorbis"]
webm-opus = ["webm", "soundkit-webm/opus"]
ac3 = ["dep:soundkit-ac3"]

[dependencies]
soundkit = { path = "../soundkit", version = "0.13.3" }
access-unit = { version = "0.1.5", optional = true }
frame-header = "0.2.2"
js-sys = "0.3"
sha2 = "0.10"
wasm-bindgen = "0.2"

soundkit-audio-demux = { path = "../soundkit-audio-demux", version = "0.13.3", optional = true }
soundkit-video = { path = "../soundkit-video", version = "0.13.3", optional = true }
soundkit-aac = { path = "../soundkit-aac", version = "0.13.3", default-features = false, optional = true }
soundkit-ac3 = { path = "../soundkit-ac3", version = "0.13.3", optional = true }
soundkit-aiff = { path = "../soundkit-aiff", version = "0.13.3", optional = true }
soundkit-alac = { path = "../soundkit-alac", version = "0.13.3", optional = true }
soundkit-flac = { path = "../soundkit-flac", version = "0.13.3", default-features = false, optional = true }
soundkit-mp3 = { path = "../soundkit-mp3", version = "0.13.3", default-features = false, optional = true }
soundkit-ogg-opus = { path = "../soundkit-ogg-opus", version = "0.13.3", default-features = false, optional = true }
# The SoundKit v2 frame-stream encoder the library import path writes with.
# Optional: it carries both codecs, so it rides the `opus` feature.
soundkit-stream = { path = "../soundkit-stream", version = "0.13.3", optional = true }
soundkit-opus = { path = "../soundkit-opus", version = "0.13.3", optional = true }
soundkit-vorbis = { path = "../soundkit-vorbis", version = "0.13.3", optional = true }
soundkit-webm = { path = "../soundkit-webm", version = "0.13.3", default-features = false, optional = true }

[dev-dependencies]
aac-wasm-bench = { path = "../aac-wasm-bench", default-features = false, features = [
  "soundkit-lc",
] }
wasm-bindgen-test = "0.3"
