[package]
name = "soundkit-aac"
version = "0.13.2"
edition = "2021"
readme = "README.md"
repository = "https://github.com/wavey-ai/soundkit"

[dependencies]
# Its own crate. 0.1.5 carries the bluray, dts and container-detection
# modules this needs, so it is taken from the registry like the rest.
access-unit = "0.1.5"
fdk-aac = { git = "https://github.com/wavey-ai/fdk-aac-rs.git", version = "0.7.0", branch = "main", optional = true }
soundkit-audio-demux = { path = "../soundkit-audio-demux", version = "0.13.2", default-features = false, features = ["mp4"], optional = true }
soundkit-aac-lc = { path = "../soundkit-aac-lc", version = "0.13.2", optional = true }

soundkit = { path = "../soundkit", version = "0.13.2" }
tracing = "0.1.40"

[features]
# The owned, pure-Rust AAC-LC decoder is the default. `fdk` opts into the
# native fdk-aac fallback for profiles the owned decoder does not cover; the
# crates.io release is pure Rust.
default = ["owned-lc"]
fdk = ["dep:fdk-aac"]
owned-lc = ["dep:soundkit-aac-lc"]
mp4-demux = ["dep:soundkit-audio-demux"]
mp4-decoder = ["owned-lc", "mp4-demux"]
mp4-fdk-fallback = ["mp4-decoder", "fdk"]

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mp4 = "0.14.0"
