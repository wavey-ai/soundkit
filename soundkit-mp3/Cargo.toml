[package]
name = "soundkit-mp3"
version = "0.12.3"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
default = ["encode"]
encode = ["dep:mp3lame-encoder", "dep:mp3lame-sys"]

[dependencies]
mp3lame-encoder = { version = "0.2.1", optional = true }
mp3lame-sys = { version = "0.1.9", optional = true }
soundkit = { path = "../soundkit" }
tracing = "0.1.40"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
