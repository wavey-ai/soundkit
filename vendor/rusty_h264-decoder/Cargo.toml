[package]
name = "rusty_h264-decoder"
version = "0.10.0"
edition = "2021"
rust-version = "1.80"
authors = ["Mata Network"]
license = "BSD-2-Clause"
repository = "https://github.com/remade-with-rust/rusty_h264"
description = "Pure-Rust H.264 decoder vendored from rusty_h264 0.10.0."
readme = "README.md"
build = "build.rs"

[features]
default = ["global-alloc"]
global-alloc = ["rusty_h264-common/global-alloc"]
asm = ["dep:rusty_h264-accel", "rusty_h264-common/asm"]
profile = ["rusty_h264-common/profile"]

[dependencies]
rusty_h264-common = { version = "=0.10.0", default-features = false }
rusty_h264-accel = { version = "=0.10.0", optional = true }

[lints.rust]
unsafe_code = "forbid"
