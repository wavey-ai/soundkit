[package]
name = "lori-asha-premix-bench"
version = "0.13.2"
edition = "2021"
publish = false
license = "MIT"
description = "Benchmark comparing the SoundKit Opus adapter, codec core, and libopus"

[dependencies]
bytes = "1"
libc = "0.2.158"
soundkit = { path = "../soundkit", version = "0.13.2" }
soundkit-decoder = { path = "../soundkit-decoder", version = "0.13.2" }
soundkit-opus = { path = "../soundkit-opus", version = "0.13.2" }
opus-sys = { package = "opus-sys", git = "https://github.com/wavey-ai/opus-rs", version = "0.1.0", branch = "main" }
