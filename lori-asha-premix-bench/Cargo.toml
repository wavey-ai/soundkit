[package]
name = "lori-asha-premix-bench"
version = "0.12.3"
edition = "2021"
publish = false
license = "MIT"
description = "Benchmark comparing the SoundKit Opus adapter, codec core, and libopus"

[dependencies]
bytes = "1"
libc = "0.2.158"
soundkit = { path = "../soundkit", version = "0.12.3" }
soundkit-decoder = { path = "../soundkit-decoder" }
soundkit-opus = { path = "../soundkit-opus" }
opus-sys = { package = "opus-sys", git = "https://github.com/wavey-ai/opus-rs", branch = "main" }
