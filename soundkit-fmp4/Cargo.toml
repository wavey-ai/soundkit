[package]
name = "soundkit-fmp4"
version = "0.13.2"
edition = "2021"
license = "MIT"
description = "Zero-transcode Soundkit v2 audio to fragmented MP4 reboxing"
repository = "https://github.com/wavey-ai/soundkit"

[dependencies]
access-unit = "0.1.5"
boxer = { package = "wavey-boxer", version = "0.1.1" }
bytes = "1"
frame-header = "0.2.2"
soundkit = { path = "../soundkit", version = "0.13.2" }

[dev-dependencies]
criterion = "0.5"
hound = "3.5"
soundkit-flac = { path = "../soundkit-flac", version = "0.13.2", default-features = false }
soundkit-opus = { path = "../soundkit-opus", version = "0.13.2" }

[[bench]]
name = "rebox"
harness = false

[[example]]
name = "generate_fixture"
